name: GLiNER Runtime Release-Hinweis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-hinweis:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: GLiNER Release-Hinweis
        shell: powershell
        run: |
          $versionFile = ".\packages\gliner-runtime\current\VERSION"
          $manifestFile = ".\packages\gliner-runtime\current\manifest.json"

          if (-not (Test-Path $versionFile)) {
            throw "VERSION fehlt."
          }

          if (-not (Test-Path $manifestFile)) {
            throw "manifest.json fehlt."
          }

          $version = (
            Get-Content $versionFile -Raw -Encoding UTF8
          ).Trim()

          $manifest = Get-Content `
            $manifestFile `
            -Raw -Encoding UTF8 |
            ConvertFrom-Json

          if ($manifest.tool -ne "gliner-runtime") {
            throw "Falsches Tool im Manifest."
          }

          if ($manifest.version -ne $version) {
            throw "VERSION und Manifest-Version stimmen nicht ueberein."
          }

          if ($manifest.packages.cuda.multipart -ne $true) {
            throw "CUDA-Multipart-Metadaten fehlen."
          }

          Write-Host ""
          Write-Host "GLiNER Runtime $version"
          Write-Host ""
          Write-Host "Dieser Workflow erstellt absichtlich kein Release."
          Write-Host ""
          Write-Host "GLiNER-Runtimes werden lokal gebaut und mit"
          Write-Host "scripts\release_gliner_runtime.ps1"
          Write-Host "verifiziert und veroeffentlicht."
          Write-Host ""
          Write-Host "Grund:"
          Write-Host "Die Quell-Runtimes liegen lokal vor und sind nicht"
          Write-Host "Bestandteil eines frischen GitHub-Actions-Checkouts."
