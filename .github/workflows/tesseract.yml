name: Tesseract automatisch aktualisieren

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Aktuelle Version erneut bauen"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: tesseract-update
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Neueste offizielle Tesseract-Version ermitteln
        id: version
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/tesseract-ocr/tesseract/releases/latest" `
            -Headers @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GH_TOKEN"
              "User-Agent" = "MediaHub-Tools"
            }

          $latest = $release.tag_name.TrimStart("v")
          $currentFile = ".\packages\tesseract\current\VERSION"

          $current = if (Test-Path $currentFile) {
            (Get-Content $currentFile -Raw).Trim()
          } else {
            ""
          }

          $force = "${{ inputs.force }}" -eq "true"
          $needsBuild = $force -or ($latest -ne $current)

          "latest=$latest" >> $env:GITHUB_OUTPUT
          "current=$current" >> $env:GITHUB_OUTPUT
          "needs_build=$($needsBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Offiziell aktuell: $latest"
          Write-Host "Bei uns aktuell:    $current"
          Write-Host "Build erforderlich: $needsBuild"

      - name: Nichts zu tun
        if: steps.version.outputs.needs_build != 'true'
        shell: powershell
        run: |
          Write-Host "Keine neue Tesseract-Version vorhanden."

      - name: Neue Version bauen und vollständig prüfen
        if: steps.version.outputs.needs_build == 'true'
        shell: powershell
        run: |
          .\scripts\build_tesseract.ps1 `
            -Version "${{ steps.version.outputs.latest }}"

      - name: Tesseract-Assets im gemeinsamen Release aktualisieren
        if: steps.version.outputs.needs_build == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "mediahub-tools"
          $version = "${{ steps.version.outputs.latest }}"

          $releaseJson = gh release view $tag `
            --json tagName,assets

          if ($LASTEXITCODE -ne 0) {
            throw "Gemeinsames Release $tag wurde nicht gefunden."
          }

          $release = $releaseJson | ConvertFrom-Json

          $protectedBefore = @(
            $release.assets |
              Where-Object {
                $_.name -notin @(
                  "Tesseract-Projekt.zip",
                  "Tesseract-Projekt.zip.sha256",
                  "tesseract-manifest.json"
                )
              } |
              ForEach-Object { $_.name } |
              Sort-Object
          )

          Write-Host "Nicht-Tesseract-Assets vor Update:"

          foreach ($name in $protectedBefore) {
            Write-Host " - $name"
          }

          Copy-Item `
            ".\release\manifest.json" `
            ".\release\tesseract-manifest.json" `
            -Force

          gh release upload $tag `
            ".\release\Tesseract-Projekt.zip" `
            ".\release\Tesseract-Projekt.zip.sha256" `
            ".\release\tesseract-manifest.json" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Tesseract-Assets konnten nicht aktualisiert werden."
          }

          $afterJson = gh release view $tag `
            --json assets

          if ($LASTEXITCODE -ne 0) {
            throw "Release konnte nach dem Upload nicht geprüft werden."
          }

          $after = $afterJson | ConvertFrom-Json

          $namesAfter = @(
            $after.assets |
              ForEach-Object { $_.name }
          )

          foreach ($required in @(
            "Tesseract-Projekt.zip",
            "Tesseract-Projekt.zip.sha256",
            "tesseract-manifest.json"
          )) {
            if ($required -notin $namesAfter) {
              throw "Tesseract-Asset fehlt nach Upload: $required"
            }
          }

          $protectedAfter = @(
            $after.assets |
              Where-Object {
                $_.name -notin @(
                  "Tesseract-Projekt.zip",
                  "Tesseract-Projekt.zip.sha256",
                  "tesseract-manifest.json"
                )
              } |
              ForEach-Object { $_.name } |
              Sort-Object
          )

          if (
            (Compare-Object $protectedBefore $protectedAfter).Count -ne 0
          ) {
            throw "STOP: Nicht-Tesseract-Assets wurden verändert."
          }

          Write-Host ""
          Write-Host "OK - Tesseract $version aktualisiert."
          Write-Host "OK - GLiNER und alle anderen Assets blieben erhalten."

      - name: Repository erst nach erfolgreichem Release rotieren
        if: steps.version.outputs.needs_build == 'true'
        shell: powershell
        run: |
          .\scripts\rotate_tesseract.ps1 `
            -Version "${{ steps.version.outputs.latest }}"

      - name: Aktuellen und vorherigen Stand einchecken
        if: steps.version.outputs.needs_build == 'true'
        shell: powershell
        run: |
          git config user.name "MediaHub Tools Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packages/tesseract/current packages/tesseract/previous

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Keine Repository-Dateien zu aktualisieren."
          } else {
            $global:LASTEXITCODE = 0

            git commit -m "Tesseract ${{ steps.version.outputs.latest }} bereitstellen"
            git push origin main

            if ($LASTEXITCODE -ne 0) {
              throw "Repository-Aktualisierung fehlgeschlagen."
            }
          }
